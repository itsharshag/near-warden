[package]
name = "warden"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Warden: a NEAR wallet contract for AI agents that verifies a TEE-signed AI judge verdict on chain before paying"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
